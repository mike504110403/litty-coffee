# dev 疊加：web 綁在主機的 Tailscale IP（tailnet 直連，不綁 0.0.0.0），
# 另外經 Cloudflare Tunnel 對外為 https://dev-admin.litty-coffee.com（前面再加 Cloudflare Access 擋外人）。
# 主機開了 net.ipv4.ip_nonlocal_bind=1（bootstrap.sh），開機時 Tailscale 還沒拿到 IP 也綁得上。
services:
  web:
    ports:
      - "${WEB_BIND:?WEB_BIND 未設（主機 Tailscale IP）}:${WEB_PORT:-8080}:80"
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN 未設}
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: ${CLOUDFLARED_MEM_LIMIT:-96m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
