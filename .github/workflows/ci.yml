name: CI

# PR 與一般分支的 push 在這裡跑；dev／main 的 push 由 deploy.yml 以 workflow_call 呼叫同一份 CI（避免重跑兩次），
# 通過後才建映像與部署。
on:
  pull_request:
  push:
    branches-ignore: [dev, main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        # 拋棄式測試庫（只活在這個 job），POSTGRES_DB 直接建出 litty_test
        env:
          POSTGRES_USER: litty
          POSTGRES_PASSWORD: litty
          POSTGRES_DB: litty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U litty -d litty_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://litty:litty@localhost:5432/litty_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test（-p 1：各套件共用同一個測試庫）
        run: go test -p 1 ./...

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
