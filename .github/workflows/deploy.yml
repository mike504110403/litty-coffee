name: Deploy

# push dev → 部署 dev：CI（同一份 ci.yml）與建映像（只推 <sha> tag）同時跑，兩者都過才改標 dev、部署。
# push main → 部署 prod：同一個 commit 已在 dev 成功部署過 → 直接把那份 <sha> 映像改標 prod 部署（不重跑 CI、不重建）；
#   沒在 dev 部署過 → 走與 dev 相同的完整流程。
# 手動觸發（workflow_dispatch）＝回滾：把既有的 <sha> 映像重新標成 dev／prod 後部署，不重建。
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 部署目標環境
        type: choice
        options: [dev, prod]
        required: true
      sha:
        description: 要回滾到的映像 tag（完整 40 碼 commit sha，GHCR 上須已存在）
        type: string
        required: true

permissions:
  contents: read

# 同一環境同時只跑一個部署；排隊不取消（避免部署做到一半被砍）
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/mike504110403/litty-coffee-backend
  WEB_IMAGE: ghcr.io/mike504110403/litty-coffee-web
  DEPLOY_HOST: litty-server

jobs:
  meta:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # 查 dev 是否已成功部署過同一個 commit
    outputs:
      env: ${{ steps.m.outputs.env }}
      tag: ${{ steps.m.outputs.tag }}
      # reuse=true：直接沿用既有的 <sha> 映像（不跑 CI、不重建），只在部署時改標成環境 tag
      reuse: ${{ steps.m.outputs.reuse }}
    steps:
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          IN_ENV: ${{ inputs.environment }}
          IN_SHA: ${{ inputs.sha }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          reuse=false
          if [ "$EVENT" = workflow_dispatch ]; then
            env_name="$IN_ENV"
            tag="$IN_SHA"
            if ! printf '%s' "$tag" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "sha 必須是完整 40 碼 commit sha" >&2
              exit 1
            fi
            reuse=true
          else
            if [ "$REF" = main ]; then env_name=prod; else env_name=dev; fi
            tag="$SHA"
            # main：同一個 commit 已在 dev 成功部署過（CI 通過、映像已建好且 dev 驗過）→ 直接升級同一份映像
            if [ "$env_name" = prod ]; then
              n=$(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?branch=dev&head_sha=$SHA&status=success&per_page=1" --jq '.total_count' || echo 0)
              if [ "${n:-0}" -gt 0 ]; then reuse=true; fi
            fi
          fi
          {
            echo "env=$env_name"
            echo "tag=$tag"
            echo "reuse=$reuse"
          } >> "$GITHUB_OUTPUT"
          echo "部署 $env_name ← $tag（沿用既有映像：$reuse）"

  ci:
    needs: meta
    if: github.event_name == 'push' && needs.meta.outputs.reuse != 'true'
    uses: ./.github/workflows/ci.yml

  # 與 CI 同時跑：只推 <sha> tag；環境 tag（dev／prod）由 deploy 在 CI 也通過後才改標，
  # 所以 CI 沒過的映像永遠不會被主機拉到
  build:
    needs: meta
    if: github.event_name == 'push' && needs.meta.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: backend
            image: ghcr.io/mike504110403/litty-coffee-backend
          - name: web
            context: frontend
            image: ghcr.io/mike504110403/litty-coffee-web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image }}:${{ needs.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: [meta, ci, build]
    # 沿用既有映像（main 升級、手動回滾）只要 meta 成功；否則 CI 與建置都要成功
    if: >-
      !cancelled() && needs.meta.result == 'success' &&
      (needs.meta.outputs.reuse == 'true' ||
       (needs.ci.result == 'success' && needs.build.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    environment:
      name: ${{ needs.meta.outputs.env }}
      url: ${{ needs.meta.outputs.env == 'prod' && 'https://admin.litty-coffee.com' || '' }}
    env:
      ENV_NAME: ${{ needs.meta.outputs.env }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 把 <sha> 映像標成環境 tag
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          for img in "$BACKEND_IMAGE" "$WEB_IMAGE"; do
            docker buildx imagetools create -t "$img:$ENV_NAME" "$img:$TAG"
          done

      - name: 加入 Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.DEPLOY_HOST }}

      - name: SSH 設定
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host $DEPLOY_HOST
            User deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
          EOF
          chmod 600 ~/.ssh/config

      - name: 複製 compose 檔與部署腳本
        run: |
          scp deploy/compose.yml "deploy/compose.$ENV_NAME.yml" deploy/deploy.sh "$DEPLOY_HOST:/opt/litty/$ENV_NAME/"
          # shellcheck disable=SC2029  # 路徑刻意在 runner 端展開
          ssh "$DEPLOY_HOST" chmod 755 "/opt/litty/$ENV_NAME/deploy.sh"

      - name: 主機登入 GHCR（本 job 的短效 token）
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_HOST" docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: pull、up -d、健康檢查
        run: |
          # shellcheck disable=SC2029  # 路徑與環境名刻意在 runner 端展開
          ssh "$DEPLOY_HOST" "/opt/litty/$ENV_NAME/deploy.sh" "$ENV_NAME"

      - name: 主機登出 GHCR
        if: always()
        run: ssh "$DEPLOY_HOST" docker logout ghcr.io || true
